name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA (TrollStore)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 构建指纹：把 git 短 SHA 编译进 App，启动日志可见，防止"装错包"无从判断
      - name: Stamp build id
        run: |
          SHA=$(git rev-parse --short HEAD)
          cat > FMMedia/Core/BuildStamp.swift <<EOF
          // CI 自动生成，勿手动编辑
          enum BuildStamp {
              static let gitSHA = "$SHA"
          }
          EOF
          grep -n "gitSHA" FMMedia/Core/BuildStamp.swift

      - name: Read version
        run: |
          VERSION=$(grep -E 'MARKETING_VERSION' project.yml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "App version: $VERSION"

      # 以 project.yml 为准同步到工程文件，避免两处版本号脱节
      - name: Sync version into project
        run: |
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = ${VERSION};/g" "FMMedia.xcodeproj/project.pbxproj"
          grep -n "MARKETING_VERSION" "FMMedia.xcodeproj/project.pbxproj"

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcodebuild -project "FMMedia.xcodeproj" -list

      - name: Build (unsigned, Release)
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/xcodebuild.log"
          xcodebuild \
            -project "FMMedia.xcodeproj" \
            -scheme "FMMedia" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee "$LOG"
          echo "---- summary ----"
          grep -E "(error:|BUILD SUCCEEDED|BUILD FAILED)" "$LOG" | tail -20 || true

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_DIR="$RUNNER_TEMP/build/Build/Products/Release-iphoneos"
          APP=$(find "$APP_DIR" -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "no .app"; exit 1; fi
          codesign --force --sign - --timestamp=none "$APP" || true

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          IPA="FMMedia-${VERSION}.ipa"
          zip -qry "$IPA" Payload
          echo "IPA_PATH=$RUNNER_TEMP/$IPA" >> "$GITHUB_ENV"
          echo "IPA size: $(du -h "$IPA" | cut -f1)"
          ls -l "$IPA"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: FMMedia-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA="FMMedia-${VERSION}.ipa"
          TAG="v${VERSION}"
          cp "$IPA_PATH" "$IPA"
          NOTES="FM影媒 ${VERSION}（免签 IPA，TrollStore 安装）

          构建于 main 分支 $(git rev-parse --short HEAD)。

          > 覆盖安装同一版本时，如遇安装失败，请先卸载旧版。"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber --repo "$GITHUB_REPOSITORY"
            echo "Updated asset on existing release $TAG"
          else
            gh release create "$TAG" "$IPA" \
              --title "FM影媒 $VERSION" \
              --notes "$NOTES" \
              --repo "$GITHUB_REPOSITORY"
          fi
