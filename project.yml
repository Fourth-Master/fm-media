name: FMMedia
options:
  bundleIdPrefix: com.fmmedia
  deploymentTarget:
    iOS: "15.4"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "15.4"
    MARKETING_VERSION: "1.8.13"
    CURRENT_PROJECT_VERSION: "1"

targets:
  FMMedia:
    type: application
    platform: iOS
    deploymentTarget: "15.4"
    sources:
      - path: FMMedia
    settings:
      base:
        PRODUCT_NAME: FMMedia
        PRODUCT_BUNDLE_IDENTIFIER: com.fmmedia.fmplayer
        INFOPLIST_FILE: AppConfig/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
    # 可选：启用 SMB 时取消下面注释
    # dependencies:
    #   - package: AMSMB2
    #     product: AMSMB2

    # MobileVLCKit（脚本自动下载到 Vendor/）
    dependencies:
      - framework: Vendor/MobileVLCKit.xcframework
        embed: true
        codeSign: true
